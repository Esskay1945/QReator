<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .type-selector {
            margin-bottom: 30px;
        }

        .type-selector h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .type-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .type-btn {
            padding: 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .type-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .type-btn.active {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .type-btn svg {
            width: 30px;
            height: 30px;
            margin-bottom: 8px;
        }

        .type-btn span {
            display: block;
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        .input-section {
            display: none;
        }

        .input-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            font-family: inherit;
        }

        .qr-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .qr-container {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            min-height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-placeholder {
            text-align: center;
            color: #999;
        }

        .qr-placeholder-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        #qrImage {
            max-width: 300px;
            display: none;
        }

        #qrImage.show {
            display: block;
        }

        .download-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: none;
        }

        .download-btn.show {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .main-card {
                padding: 20px;
            }

            .type-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔲 QR Code Generator</h1>
            <p>Create custom QR codes for URLs, emails, and WiFi networks</p>
        </div>

        <div class="main-card">
            <div class="content-grid">
                <!-- Left Side - Input -->
                <div>
                    <div class="type-selector">
                        <h2>Select QR Code Type</h2>
                        <div class="type-buttons">
                            <button class="type-btn active" data-type="url">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                                </svg>
                                <span>URL</span>
                            </button>
                            <button class="type-btn" data-type="email">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                </svg>
                                <span>Email</span>
                            </button>
                            <button class="type-btn" data-type="wifi">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"/>
                                </svg>
                                <span>WiFi</span>
                            </button>
                        </div>
                    </div>

                    <!-- URL Input -->
                    <div id="urlInput" class="input-section active">
                        <div class="form-group">
                            <label>Enter URL</label>
                            <input type="text" id="urlField" placeholder="https://example.com">
                        </div>
                    </div>

                    <!-- Email Input -->
                    <div id="emailInput" class="input-section">
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="emailField" placeholder="example@email.com">
                        </div>
                        <div class="form-group">
                            <label>Subject (Optional)</label>
                            <input type="text" id="subjectField" placeholder="Email subject">
                        </div>
                        <div class="form-group">
                            <label>Message (Optional)</label>
                            <textarea id="bodyField" rows="3" placeholder="Email message"></textarea>
                        </div>
                    </div>

                    <!-- WiFi Input -->
                    <div id="wifiInput" class="input-section">
                        <div class="form-group">
                            <label>Network Name (SSID)</label>
                            <input type="text" id="ssidField" placeholder="My WiFi Network">
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="text" id="passwordField" placeholder="WiFi password">
                        </div>
                        <div class="form-group">
                            <label>Encryption</label>
                            <select id="encryptionField">
                                <option value="WPA">WPA/WPA2</option>
                                <option value="WEP">WEP</option>
                                <option value="nopass">None</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Right Side - QR Preview -->
                <div class="qr-preview">
                    <div class="qr-container">
                        <div id="qrPlaceholder" class="qr-placeholder">
                            <div class="qr-placeholder-icon">📱</div>
                            <p>Enter data to generate QR code</p>
                        </div>
                        <img id="qrImage" alt="Generated QR Code">
                    </div>
                    <button id="downloadBtn" class="download-btn">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                        </svg>
                        Download QR Code
                    </button>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Scan the generated QR code with your smartphone camera to test it!</p>
        </div>
    </div>

    <script>
        let currentType = 'url';

        // Type selector
        const typeButtons = document.querySelectorAll('.type-btn');
        const inputSections = document.querySelectorAll('.input-section');

        typeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Update active button
                typeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Update active input section
                currentType = btn.dataset.type;
                inputSections.forEach(section => section.classList.remove('active'));
                document.getElementById(currentType + 'Input').classList.add('active');

                // Generate QR code
                generateQRCode();
            });
        });

        // Input listeners
        document.getElementById('urlField').addEventListener('input', generateQRCode);
        document.getElementById('emailField').addEventListener('input', generateQRCode);
        document.getElementById('subjectField').addEventListener('input', generateQRCode);
        document.getElementById('bodyField').addEventListener('input', generateQRCode);
        document.getElementById('ssidField').addEventListener('input', generateQRCode);
        document.getElementById('passwordField').addEventListener('input', generateQRCode);
        document.getElementById('encryptionField').addEventListener('change', generateQRCode);

        function generateQRCode() {
            let data = '';

            switch(currentType) {
                case 'url':
                    data = document.getElementById('urlField').value;
                    break;
                case 'email':
                    const email = document.getElementById('emailField').value;
                    const subject = document.getElementById('subjectField').value;
                    const body = document.getElementById('bodyField').value;
                    if (email) {
                        data = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                    }
                    break;
                case 'wifi':
                    const ssid = document.getElementById('ssidField').value;
                    const password = document.getElementById('passwordField').value;
                    const encryption = document.getElementById('encryptionField').value;
                    if (ssid) {
                        data = `WIFI:T:${encryption};S:${ssid};P:${password};;`;
                    }
                    break;
            }

            const qrImage = document.getElementById('qrImage');
            const qrPlaceholder = document.getElementById('qrPlaceholder');
            const downloadBtn = document.getElementById('downloadBtn');

            if (data) {
                const encodedData = encodeURIComponent(data);
                qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodedData}`;
                qrImage.classList.add('show');
                qrPlaceholder.style.display = 'none';
                downloadBtn.classList.add('show');
            } else {
                qrImage.classList.remove('show');
                qrPlaceholder.style.display = 'block';
                downloadBtn.classList.remove('show');
            }
        }

        // Download functionality
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const qrImage = document.getElementById('qrImage');
            if (qrImage.src) {
                const link = document.createElement('a');
                link.href = qrImage.src;
                link.download = `qrcode-${currentType}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        });
    </script>
</body>
</html>
